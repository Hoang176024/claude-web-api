services:
  claude-service:
    build:
      context: .
    container_name: claude-service
    environment:
      - SQLITE_DB_PATH=/app/data/sqlite.db
      - CLAUDE_SESSION_KEY=${CLAUDE_SESSION_KEY:-}
      - CLAUDE_PROXY=${CLAUDE_PROXY:-}
    volumes:
      - ../Noveral/web/data:/app/data:ro
    ports:
      - "3002:3002"
    restart: unless-stopped
